name: Framework Tests

on:
  workflow_run:
    workflows:
      - Docker Build
    types:
      - completed
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  laravel-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/ppc64le, linux/s390x]
        include:
          # Laravel 12 — PHP ^8.2
          - oort-version: 8.2
            laravel-version: '12'
          - oort-version: 8.3
            laravel-version: '12'
          - oort-version: 8.4
            laravel-version: '12'
          - oort-version: 8.5
            laravel-version: '12'
          - oort-version: 8.6-rc
            laravel-version: '12'
          # Laravel 13 — PHP ^8.3
          - oort-version: 8.3
            laravel-version: '13'
          - oort-version: 8.4
            laravel-version: '13'
          - oort-version: 8.5
            laravel-version: '13'
          - oort-version: 8.6-rc
            laravel-version: '13'

    continue-on-error: ${{ matrix.oort-version == '8.6-rc' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x

      - uses: docker/setup-buildx-action@v4

      - name: Platform slug
        id: platform
        run: echo "slug=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Pull OORT image
        run: docker pull --platform "${{ matrix.platform }}" thecaliskan/oort:${{ matrix.oort-version }}

      - name: Build Laravel test image
        uses: docker/build-push-action@v7
        with:
          context: tests/laravel
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: oort-test-laravel:${{ matrix.oort-version }}-${{ matrix.laravel-version }}-${{ steps.platform.outputs.slug }}
          build-args: |
            OORT_IMAGE=thecaliskan/oort:${{ matrix.oort-version }}
            LARAVEL_VERSION=${{ matrix.laravel-version }}.0
          cache-from: type=gha,scope=laravel-${{ matrix.oort-version }}-${{ matrix.laravel-version }}-${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=laravel-${{ matrix.oort-version }}-${{ matrix.laravel-version }}-${{ steps.platform.outputs.slug }}

      - name: Start framework test dependencies
        run: docker compose -f tests/docker-compose.yml up -d --wait

      - name: Test Laravel services
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: bash tests/scripts/laravel.sh "${{ matrix.oort-version }}" "${{ matrix.laravel-version }}"

      - name: Stop framework test dependencies
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v

  symfony-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/ppc64le, linux/s390x]
        include:
          # Symfony 7.4 — PHP ^8.2
          - oort-version: 8.2
            symfony-version: '7.4'
          - oort-version: 8.3
            symfony-version: '7.4'
          - oort-version: 8.4
            symfony-version: '7.4'
          - oort-version: 8.5
            symfony-version: '7.4'
          - oort-version: 8.6-rc
            symfony-version: '7.4'
          # Symfony 8.0 — PHP ^8.4
          - oort-version: 8.4
            symfony-version: '8.0'
          - oort-version: 8.5
            symfony-version: '8.0'
          - oort-version: 8.6-rc
            symfony-version: '8.0'
          # Symfony 8.1 — PHP ^8.4
          - oort-version: 8.4
            symfony-version: '8.1'
          - oort-version: 8.5
            symfony-version: '8.1'
          - oort-version: 8.6-rc
            symfony-version: '8.1'

    continue-on-error: ${{ matrix.oort-version == '8.6-rc' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x

      - uses: docker/setup-buildx-action@v4

      - name: Platform slug
        id: platform
        run: echo "slug=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Pull OORT image
        run: docker pull --platform "${{ matrix.platform }}" thecaliskan/oort:${{ matrix.oort-version }}

      - name: Build Symfony test image
        uses: docker/build-push-action@v7
        with:
          context: tests/symfony
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: oort-test-symfony:${{ matrix.oort-version }}-${{ matrix.symfony-version }}-${{ steps.platform.outputs.slug }}
          build-args: |
            OORT_IMAGE=thecaliskan/oort:${{ matrix.oort-version }}
            SYMFONY_VERSION=${{ matrix.symfony-version }}
          cache-from: type=gha,scope=symfony-${{ matrix.oort-version }}-${{ matrix.symfony-version }}-${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=symfony-${{ matrix.oort-version }}-${{ matrix.symfony-version }}-${{ steps.platform.outputs.slug }}

      - name: Start framework test dependencies
        run: docker compose -f tests/docker-compose.yml up -d --wait

      - name: Test Symfony services
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: bash tests/scripts/symfony.sh "${{ matrix.oort-version }}" "${{ matrix.symfony-version }}"

      - name: Stop framework test dependencies
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v
